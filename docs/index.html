<!DOCTYPE html>
<html lang="en" class="govuk-template">
<script>
    (function() {
        var stored = localStorage.getItem('arckit-theme');
        if (stored) {
            document.documentElement.setAttribute('data-theme', stored);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Unified SDG Architecture Documentation - 17 UN Sustainable Development Goal workspaces">
    <title>SDG Architecture Portfolio - ArcKit</title>

    <!-- GOV.UK Frontend -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/govuk-frontend@5.13.0/dist/govuk/govuk-frontend.min.css">

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js"></script>

    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>

    <!-- SVG Pan Zoom for interactive diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>

    <style>
        :root {
            --sidebar-width: 320px;
            --sidebar-collapsed-width: 0px;
            --toc-width: 220px;
            --header-height: 50px;
            --transition-speed: 0.3s;
            --bg-page: #ffffff;
            --bg-surface: #ffffff;
            --bg-surface-alt: #f3f2f1;
            --bg-sidebar: #f3f2f1;
            --bg-header: #0b0c0c;
            --bg-code: #f3f2f1;
            --bg-code-block: #0b0c0c;
            --bg-hover: #e8e8e8;
            --text-primary: #0b0c0c;
            --text-secondary: #505a5f;
            --text-inverse: #ffffff;
            --text-code-block: #ffffff;
            --text-link: #1d70b8;
            --text-link-hover: #003078;
            --border-main: #b1b4b6;
            --border-light: #e8e8e8;
            --color-success: #00703c;
            --color-warning: #f47738;
            --color-error: #d4351c;
            --color-focus: #ffdd00;
            --primary-color: var(--text-link);
            --primary-dark: var(--text-link-hover);
            --background-light: var(--bg-surface-alt);
            --border-color: var(--border-main);
            --text-muted: var(--text-secondary);
        }

        [data-theme="dark"] {
            --bg-page: #1a1a1a;
            --bg-surface: #232323;
            --bg-surface-alt: #2a2a2a;
            --bg-sidebar: #1e1e1e;
            --bg-header: #0b0c0c;
            --bg-code: #2a2a2a;
            --bg-code-block: #1a1a1a;
            --bg-hover: #333333;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-inverse: #ffffff;
            --text-code-block: #e0e0e0;
            --text-link: #6eb0e6;
            --text-link-hover: #a0cfef;
            --border-main: #444444;
            --border-light: #333333;
            --color-success: #00a04e;
            --color-warning: #ff9f5a;
            --color-error: #e85a4a;
            --color-focus: #ffdd00;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-page: #1a1a1a; --bg-surface: #232323; --bg-surface-alt: #2a2a2a;
                --bg-sidebar: #1e1e1e; --bg-header: #0b0c0c; --bg-code: #2a2a2a;
                --bg-code-block: #1a1a1a; --bg-hover: #333333;
                --text-primary: #e0e0e0; --text-secondary: #a0a0a0; --text-inverse: #ffffff;
                --text-code-block: #e0e0e0; --text-link: #6eb0e6; --text-link-hover: #a0cfef;
                --border-main: #444444; --border-light: #333333;
                --color-success: #00a04e; --color-warning: #ff9f5a; --color-error: #e85a4a;
                --color-focus: #ffdd00;
            }
        }

        body, .govuk-template, .govuk-template__body, [class*="govuk-"] {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        body { background: var(--bg-page); color: var(--text-primary); }
        html { scroll-behavior: smooth; }

        /* Layout */
        .app-layout { display: flex; min-height: calc(100vh - var(--header-height) - 80px); }

        /* Sidebar */
        .app-sidebar {
            width: var(--sidebar-width); min-width: var(--sidebar-width);
            background: var(--bg-sidebar); border-right: 1px solid var(--border-color);
            overflow-y: auto; position: sticky; top: 0;
            height: calc(100vh - var(--header-height));
            transition: width var(--transition-speed), min-width var(--transition-speed);
            display: flex; flex-direction: column;
        }
        .app-sidebar.collapsed { width: var(--sidebar-collapsed-width); min-width: var(--sidebar-collapsed-width); overflow: hidden; }
        .app-sidebar-header { padding: 1rem; background: var(--primary-color); color: var(--text-inverse); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .app-sidebar-header h2 { color: var(--text-inverse); margin: 0; font-size: 1.1rem; }
        .app-sidebar-toggle { background: transparent; border: none; color: var(--text-inverse); cursor: pointer; font-size: 1.25rem; padding: 0.25rem; opacity: 0.8; }
        .app-sidebar-toggle:hover { opacity: 1; }

        /* Search */
        .app-search { padding: 0.75rem 1rem; background: var(--bg-surface); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .app-search-input { width: 100%; padding: 0.5rem 0.75rem; border: 2px solid var(--border-color); border-radius: 0; font-size: 0.9rem; font-family: inherit; background: var(--bg-surface); color: var(--text-primary); }
        .app-search-input:focus { outline: 3px solid var(--color-focus); outline-offset: 0; border-color: var(--text-primary); }
        .app-search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-surface); border: 1px solid var(--border-color); border-top: none; max-height: 300px; overflow-y: auto; z-index: 100; display: none; }
        .app-search-results.visible { display: block; }
        .app-search-result { padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.875rem; border-bottom: 1px solid var(--background-light); }
        .app-search-result:hover { background: var(--background-light); }
        .app-search-result-title { font-weight: 600; }
        .app-search-result-path { font-size: 0.75rem; color: var(--text-muted); }

        /* Navigation */
        .app-nav-container { flex: 1; overflow-y: auto; }
        .app-nav-section { border-bottom: 1px solid var(--border-color); }
        .app-nav-section-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-weight: 700; border: none; width: 100%; text-align: left; font-size: 0.9rem; }
        .app-nav-section-header:hover { background: var(--background-light); }
        .app-nav-section-header .chevron { transition: transform 0.2s; font-size: 0.75rem; }
        .app-nav-section-header.collapsed .chevron { transform: rotate(-90deg); }
        .app-nav-list { list-style: none; margin: 0; padding: 0; }
        .app-nav-list li { margin: 0; }
        .app-nav-list a { display: block; padding: 0.5rem 1rem 0.5rem 1.5rem; color: var(--primary-color); text-decoration: none; font-size: 0.875rem; border-left: 4px solid transparent; transition: background 0.15s, border-color 0.15s; }
        .app-nav-list a:hover { background: var(--bg-surface); border-left-color: var(--primary-color); }
        .app-nav-list a.active { background: var(--bg-surface); border-left-color: var(--primary-color); font-weight: 700; }
        .app-nav-category { font-size: 0.7rem; color: var(--text-muted); padding: 0.5rem 1rem 0.25rem 1.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .app-nav-external { padding: 6px 12px 6px 16px; font-size: 14px; color: var(--text-secondary); font-style: italic; }
        .app-nav-file-type { font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-left: 4px; }

        /* SDG nav styling */
        .app-nav-sdg-header { display: flex; align-items: center; gap: 0.5rem; }
        .app-nav-sdg-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 3px; color: #fff; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
        .app-nav-sdg-count { font-size: 0.7rem; color: var(--text-muted); font-weight: 400; margin-left: auto; }
        .app-nav-project-header { font-size: 0.8rem; padding: 0.5rem 1rem 0.25rem 2rem; color: var(--text-primary); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface-alt); border-bottom: 1px solid var(--border-light); }
        .app-nav-project-header:hover { background: var(--bg-hover); }
        .app-nav-project-header .chevron { font-size: 0.6rem; }
        .app-nav-project-header.collapsed .chevron { transform: rotate(-90deg); }
        .app-nav-project-list a { padding-left: 2.5rem; font-size: 0.8rem; }

        /* Content */
        .app-content-wrapper { flex: 1; display: flex; min-width: 0; position: relative; }
        .app-content { flex: 1; padding: 2rem 2rem 2rem 2.5rem; overflow-y: auto; min-width: 0; }
        .app-content-inner { max-width: 100%; }

        /* Table of Contents */
        .app-toc { width: var(--toc-width); min-width: var(--toc-width); padding: 1.5rem 1rem; border-right: 1px solid var(--border-color); position: sticky; top: 0; height: calc(100vh - var(--header-height)); overflow-y: auto; font-size: 0.8125rem; background: var(--background-light); }
        .app-toc-title { font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; }
        .app-toc-list { list-style: none; margin: 0; padding: 0; }
        .app-toc-list li { margin: 0; }
        .app-toc-list a { display: block; padding: 0.25rem 0.75rem 0.25rem 0; color: var(--text-muted); text-decoration: none; border-right: 2px solid transparent; margin-right: -1rem; transition: color 0.15s, border-color 0.15s; }
        .app-toc-list a:hover { color: var(--primary-color); }
        .app-toc-list a.active { color: var(--primary-color); border-right-color: var(--primary-color); }
        .app-toc-list .toc-h3 { padding-left: 0.75rem; font-size: 0.75rem; }

        /* Document Header */
        .app-doc-header { border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 2rem; }
        .app-doc-breadcrumb { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .app-doc-title { margin: 0; font-size: 2.25rem; }

        /* Loading / Error */
        .app-loading { display: flex; align-items: center; justify-content: center; padding: 4rem; color: var(--text-muted); }
        .app-spinner { width: 24px; height: 24px; border: 3px solid var(--background-light); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .app-error { background: var(--color-warning); color: var(--text-inverse); padding: 1rem; margin-bottom: 1rem; }

        /* Header */
        .app-header { background: var(--bg-header); height: var(--header-height); display: flex; align-items: center; position: sticky; top: 0; z-index: 50; }
        .app-header__container { display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; width: 100%; }
        .app-header__left { display: flex; align-items: center; gap: 1rem; }
        .app-header__link { color: var(--text-inverse); font-size: 1.25rem; font-weight: 700; text-decoration: none; }
        .app-header__link:hover { text-decoration: underline; }
        .app-header__nav { display: flex; align-items: center; gap: 1.5rem; }
        .app-header__nav a, .app-header__stats { color: var(--border-main); text-decoration: none; font-size: 0.875rem; }
        .app-header__nav a:hover { color: var(--text-inverse); text-decoration: underline; }
        .app-header__dashboard-link { color: var(--text-inverse) !important; background: var(--color-success); padding: 0.25rem 0.75rem; border-radius: 3px; }
        .app-header__dashboard-link:hover { background: #005a30; }
        .app-header__guides-link { color: var(--text-inverse) !important; background: var(--primary-color); padding: 0.25rem 0.75rem; border-radius: 3px; }
        .app-header__guides-link:hover { background: var(--primary-dark); }

        /* Footer */
        .app-footer { background: var(--background-light); padding: 1.5rem 0; border-top: 1px solid var(--border-color); }
        .app-footer-inner { padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; color: var(--text-muted); }
        .app-footer a { color: var(--primary-color); }

        /* Sidebar expand button */
        .app-sidebar-expand { display: none; position: fixed; left: 0; top: calc(var(--header-height) + 1rem); background: var(--primary-color); color: var(--text-inverse); border: none; padding: 0.5rem 0.75rem; cursor: pointer; z-index: 99; border-radius: 0 4px 4px 0; }
        .app-sidebar.collapsed ~ .app-content-wrapper .app-sidebar-expand { display: block; }

        /* Mobile */
        .app-mobile-menu { display: none; background: transparent; border: none; color: var(--text-inverse); font-size: 1.5rem; cursor: pointer; padding: 0.25rem 0.5rem; line-height: 1; }
        .app-sidebar-backdrop { display: none; position: fixed; inset: 0; top: var(--header-height); background: rgba(0,0,0,0.5); z-index: 99; }
        .app-sidebar-backdrop.visible { display: block; }

        /* Version Badge */
        .app-version-badge { font-size: 11px; color: var(--text-inverse); opacity: 0.5; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; font-family: monospace; white-space: nowrap; }

        /* Theme Toggle */
        .app-theme-toggle { background: transparent; border: none; color: var(--text-inverse); cursor: pointer; padding: 0.25rem; display: flex; align-items: center; opacity: 0.8; }
        .app-theme-toggle:hover { opacity: 1; }
        .theme-sun { display: none; } .theme-moon { display: inline; }
        [data-theme="dark"] .theme-sun { display: inline; } [data-theme="dark"] .theme-moon { display: none; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-sun { display: inline; } :root:not([data-theme="light"]) .theme-moon { display: none; } }

        /* Icon Links */
        .app-icon-link { color: var(--text-inverse); opacity: 0.7; display: flex; align-items: center; padding: 4px; transition: opacity 0.2s; text-decoration: none; }
        .app-icon-link:hover { opacity: 1; }

        /* Dashboard KPIs */
        .app-dashboard-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .app-dashboard-kpi { background: var(--bg-surface); border: 1px solid var(--border-color); border-top: 4px solid var(--primary-color); padding: 1.25rem; }
        .app-dashboard-kpi-value { font-size: 2.25rem; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
        .app-dashboard-kpi-label { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
        .app-dashboard-kpi-bar { height: 4px; background: var(--background-light); margin-top: 0.75rem; border-radius: 2px; overflow: hidden; }
        .app-dashboard-kpi-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }

        /* Dashboard panels */
        .app-dashboard-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .app-dashboard-panel { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 1.25rem; }
        .app-dashboard-panel h3 { margin: 0 0 1rem 0; font-size: 1rem; color: var(--text-primary); }

        /* Dashboard charts */
        .app-dashboard-chart-container { display: flex; align-items: center; gap: 1.5rem; }
        .app-dashboard-chart-container svg { flex-shrink: 0; }
        .app-dashboard-legend { list-style: none; padding: 0; margin: 0; font-size: 0.8125rem; }
        .app-dashboard-legend li { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0; }
        .app-dashboard-legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
        .app-dashboard-legend-count { color: var(--text-muted); margin-left: auto; font-variant-numeric: tabular-nums; }

        /* Dashboard bars */
        .app-dashboard-bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; font-size: 0.8125rem; }
        .app-dashboard-bar-label { width: 120px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-dashboard-bar-track { flex: 1; height: 18px; background: var(--background-light); border-radius: 2px; overflow: hidden; }
        .app-dashboard-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; min-width: 2px; }
        .app-dashboard-bar-value { width: 40px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; color: var(--text-muted); }

        /* Dashboard table */
        .app-dashboard-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        .app-dashboard-table th, .app-dashboard-table td { border: 1px solid var(--border-color); padding: 0.625rem 0.75rem; text-align: left; }
        .app-dashboard-table th { background: var(--background-light); font-weight: 700; font-size: 0.8125rem; }
        .app-dashboard-table tr:hover { background: var(--bg-surface-alt); }
        .app-dashboard-coverage-bar { display: inline-block; width: 60px; height: 10px; background: var(--background-light); border-radius: 2px; overflow: hidden; vertical-align: middle; margin-right: 0.5rem; }
        .app-dashboard-coverage-fill { height: 100%; border-radius: 2px; }
        .app-dashboard-link { color: var(--primary-color); text-decoration: none; }
        .app-dashboard-link:hover { text-decoration: underline; }

        /* SDG Grid */
        .sdg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .sdg-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-top: 5px solid #ccc; padding: 1.25rem; cursor: pointer; transition: box-shadow 0.2s, transform 0.1s; }
        .sdg-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); transform: translateY(-1px); }
        .sdg-card-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .sdg-card-num { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 4px; color: #fff; font-size: 1rem; font-weight: 700; flex-shrink: 0; }
        .sdg-card-title { font-weight: 700; font-size: 1rem; line-height: 1.2; }
        .sdg-card-stats { display: flex; gap: 1.5rem; font-size: 0.8125rem; color: var(--text-muted); }
        .sdg-card-stat-value { font-weight: 700; color: var(--text-primary); font-size: 1.25rem; }
        .sdg-card-stat-label { font-size: 0.75rem; }

        /* Markdown */
        .app-markdown h1 { font-size: 2rem; margin-top: 0; }
        .app-markdown h2 { font-size: 1.5rem; margin-top: 2.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; scroll-margin-top: 1rem; }
        .app-markdown h3 { font-size: 1.25rem; margin-top: 2rem; scroll-margin-top: 1rem; }
        .app-markdown h4 { font-size: 1.1rem; margin-top: 1.5rem; }
        .app-markdown p { margin: 1rem 0; line-height: 1.6; }
        .app-markdown ul, .app-markdown ol { margin: 1rem 0; padding-left: 2rem; }
        .app-markdown li { margin: 0.5rem 0; line-height: 1.5; }
        .app-markdown table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; }
        .app-markdown th, .app-markdown td { border: 1px solid var(--border-color); padding: 0.75rem; text-align: left; }
        .app-markdown th { background: var(--background-light); font-weight: 700; }
        .app-markdown tr:hover { background: var(--bg-surface-alt); }
        .app-markdown code { background: var(--bg-code); padding: 0.125rem 0.375rem; font-family: 'SF Mono', 'Consolas', 'Liberation Mono', monospace; font-size: 0.875em; border-radius: 2px; }
        .app-markdown pre { background: var(--bg-code-block); color: var(--text-code-block); padding: 1.25rem; overflow-x: auto; margin: 1.5rem 0; }
        .app-markdown pre code { background: none; padding: 0; color: inherit; }
        .app-markdown blockquote { border-left: 4px solid var(--primary-color); margin: 1.5rem 0; padding: 0.75rem 1.25rem; background: var(--background-light); }
        .app-markdown blockquote p:first-child { margin-top: 0; }
        .app-markdown blockquote p:last-child { margin-bottom: 0; }
        .app-markdown a { color: var(--primary-color); }
        .app-markdown img { max-width: 100%; height: auto; }
        .app-markdown hr { border: none; border-top: 1px solid var(--border-color); margin: 2rem 0; }

        /* Guides list */
        .app-guides-list { list-style: none; padding: 0; margin: 0 0 2rem 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.5rem; }
        .app-guides-list li { margin: 0; }
        .app-guides-list a { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--background-light); border-left: 4px solid var(--primary-color); color: var(--primary-color); text-decoration: none; transition: background 0.15s; }
        .app-guides-list a:hover { background: var(--bg-hover); }
        .guide-status { font-size: 0.65em; padding: 2px 8px; border-radius: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; flex-shrink: 0; margin-left: 8px; }
        .guide-status.live { background: #00703c; color: var(--text-inverse); }
        .guide-status.beta { background: #1d70b8; color: var(--text-inverse); }
        .guide-status.alpha { background: #f47738; color: var(--text-inverse); }
        .guide-status.experimental { background: #912b88; color: var(--text-inverse); }

        /* Mermaid Diagrams */
        .app-markdown .mermaid { background: var(--bg-surface); padding: 1.5rem; margin: 1.5rem 0; border: 1px solid var(--border-color); text-align: center; overflow-x: auto; }
        .app-markdown .mermaid svg { max-width: 100%; height: auto; }
        .app-markdown .plantuml-diagram { background: var(--bg-surface); padding: 1.5rem; margin: 1.5rem 0; border: 1px solid var(--border-color); text-align: center; overflow-x: auto; }
        .app-markdown .plantuml-diagram img { max-width: 100%; height: auto; }
        [data-theme="dark"] .app-markdown .plantuml-diagram img { filter: invert(1) hue-rotate(180deg); }

        /* Interactive diagram containers */
        .mermaid-container { position: relative; margin: 1.5rem 0; border: 1px solid var(--border-color); background: var(--bg-surface); }
        .mermaid-viewport { overflow: hidden; cursor: grab; max-height: 70vh; min-height: 200px; }
        .mermaid-viewport:active { cursor: grabbing; }
        .mermaid-container .mermaid { padding: 0; margin: 0; border: none; overflow: visible; background: transparent; }
        .mermaid-container .mermaid svg { max-width: none; width: 100% !important; height: 100% !important; }
        .mermaid-controls { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; opacity: 0; transition: opacity 0.2s ease; z-index: 10; }
        .mermaid-container:hover .mermaid-controls { opacity: 1; }
        .mermaid-ctrl-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; color: var(--text-primary); padding: 0; line-height: 1; }
        .mermaid-ctrl-btn:hover { background: var(--bg-hover); }
        .mermaid-ctrl-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .mermaid-container.fullscreen { position: fixed; inset: 0; z-index: 200; margin: 0; border: none; }
        .mermaid-container.fullscreen .mermaid-viewport { max-height: 100vh; height: 100vh; }
        .mermaid-container.fullscreen .mermaid-controls { opacity: 1; top: 1rem; right: 1rem; }

        /* PlantUML interactive */
        .plantuml-container { position: relative; margin: 1.5rem 0; border: 1px solid var(--border-color); background: var(--bg-surface); }
        .plantuml-viewport { overflow: hidden; cursor: grab; max-height: 70vh; min-height: 200px; display: flex; align-items: center; justify-content: center; }
        .plantuml-viewport:active { cursor: grabbing; }
        .plantuml-container .plantuml-diagram { padding: 0; margin: 0; border: none; overflow: visible; background: transparent; }
        .plantuml-container .plantuml-diagram img { max-width: none; }
        .plantuml-container .plantuml-controls { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; opacity: 0; transition: opacity 0.2s ease; z-index: 10; }
        .plantuml-container:hover .plantuml-controls { opacity: 1; }
        .plantuml-container.fullscreen { position: fixed; inset: 0; z-index: 200; margin: 0; border: none; }
        .plantuml-container.fullscreen .plantuml-viewport { max-height: 100vh; height: 100vh; }
        .plantuml-container.fullscreen .plantuml-controls { opacity: 1; top: 1rem; right: 1rem; }

        /* Responsive */
        @media (max-width: 1200px) { .app-toc { display: none; } }
        @media (max-width: 900px) {
            .app-sidebar { position: fixed; left: calc(-1 * var(--sidebar-width)); top: var(--header-height); z-index: 100; height: calc(100vh - var(--header-height)); transition: left var(--transition-speed); }
            .app-sidebar.open { left: 0; box-shadow: 2px 0 8px rgba(0,0,0,0.15); }
            .app-sidebar.collapsed { left: calc(-1 * var(--sidebar-width)); }
            .app-mobile-menu { display: block; }
            .app-sidebar-expand { display: none !important; }
            .app-content { padding: 1.5rem; }
            .app-dashboard-kpis { grid-template-columns: repeat(2, 1fr); }
            .app-dashboard-panels { grid-template-columns: 1fr; }
            .mermaid-controls, .plantuml-controls { opacity: 1; }
        }
        @media (max-width: 600px) {
            .app-content { padding: 1rem; }
            .app-doc-title { font-size: 1.25rem; }
            .app-markdown h1 { font-size: 1.25rem; }
            .app-dashboard-kpis { grid-template-columns: 1fr; }
            .sdg-grid { grid-template-columns: 1fr; }
        }

        /* Print */
        @media print {
            .app-sidebar, .app-mobile-menu, .app-header, .app-footer, .app-toc, .app-sidebar-expand, .app-sidebar-backdrop { display: none !important; }
            .app-content { padding: 0; max-width: 100%; }
            .mermaid-controls { display: none !important; }
        }

        /* Focus */
        *:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 0; }

        /* Keyboard hint */
        .app-keyboard-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 2rem; }
        .app-keyboard-hint kbd { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 3px; padding: 0.125rem 0.375rem; font-family: inherit; font-size: 0.7rem; }

    <script>
        // ============================================
        // SDG Configuration
        // ============================================
        const SDGS = [
            { id: 'sdg-01-no-poverty', num: 1, name: 'No Poverty', color: '#E5243B' },
            { id: 'sdg-02-zero-hunger', num: 2, name: 'Zero Hunger', color: '#DDA63A' },
            { id: 'sdg-03-good-health', num: 3, name: 'Good Health and Well-Being', color: '#4C9F38' },
            { id: 'sdg-04-quality-education', num: 4, name: 'Quality Education', color: '#C5192D' },
            { id: 'sdg-05-gender-equality', num: 5, name: 'Gender Equality', color: '#FF3A21' },
            { id: 'sdg-06-clean-water', num: 6, name: 'Clean Water and Sanitation', color: '#26BDE2' },
            { id: 'sdg-07-clean-energy', num: 7, name: 'Affordable and Clean Energy', color: '#FCC30B' },
            { id: 'sdg-08-economic-growth', num: 8, name: 'Decent Work and Economic Growth', color: '#A21942' },
            { id: 'sdg-09-innovation', num: 9, name: 'Industry, Innovation and Infrastructure', color: '#FD6925' },
            { id: 'sdg-10-reduced-inequalities', num: 10, name: 'Reduced Inequalities', color: '#DD1367' },
            { id: 'sdg-11-sustainable-cities', num: 11, name: 'Sustainable Cities and Communities', color: '#FD9D24' },
            { id: 'sdg-12-responsible-consumption', num: 12, name: 'Responsible Consumption and Production', color: '#BF8B2E' },
            { id: 'sdg-13-climate-action', num: 13, name: 'Climate Action', color: '#3F7E44' },
            { id: 'sdg-14-life-below-water', num: 14, name: 'Life Below Water', color: '#0A97D9' },
            { id: 'sdg-15-life-on-land', num: 15, name: 'Life on Land', color: '#56C02B' },
            { id: 'sdg-16-peace-justice', num: 16, name: 'Peace, Justice and Strong Institutions', color: '#00689D' },
            { id: 'sdg-17-partnerships', num: 17, name: 'Partnerships for the Goals', color: '#19486A' }
        ];

        const CATEGORY_COLORS = {
            'Getting Started': '#4c6272', Discovery: '#1d70b8', Planning: '#00703c',
            Architecture: '#f47738', Governance: '#912b88', Compliance: '#5694ca',
            Operations: '#28a197', Procurement: '#d53880', Integrations: '#4c2c92',
            Reporting: '#85994b', Other: '#b1b4b6'
        };

        const CORE_ARTIFACTS = ['REQ', 'STKE', 'RISK', 'SOBC', 'PLAN', 'DATA'];

        // ============================================
        // State
        // ============================================
        let sdgData = [];  // Array of { sdg, manifest }
        let guidesManifest = null;  // Guides from first loaded SDG
        let documentCache = new Map();
        let allDocuments = [];
        let currentTocObserver = null;
        let TYPE_CATEGORIES = {};
        let activePanZoomInstances = [];

        // ============================================
        // Utilities
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getRawUrl(sdgId, path) {
            return `../${sdgId}/${path}`;
        }

        function extractTitle(path) {
            const filename = path.split('/').pop().replace('.md', '');
            return filename.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function debounce(fn, delay) {
            let timeout;
            return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => fn(...args), delay); };
        }

        function extractTypeCode(path) {
            const filename = path.split('/').pop();
            const match = filename.match(/^ARC-\d{3}-([A-Z][A-Z0-9-]+?)-(?:\d{3}-)?v\d/);
            return match ? match[1] : null;
        }

        function coverageColor(pct) {
            if (pct >= 80) return '#00703c';
            if (pct >= 50) return '#f47738';
            return '#d4351c';
        }

        // ============================================
        // PlantUML encoding
        // ============================================
        function plantumlEncodeHex(text) {
            const bytes = new TextEncoder().encode(text);
            let hex = '';
            for (let i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
            return '~h' + hex;
        }
        function plantumlGetUrl(source, format) {
            return 'https://www.plantuml.com/plantuml/' + (format || 'svg') + '/' + plantumlEncodeHex(source);
        }

        // ============================================
        // Marked + Mermaid Configuration
        // ============================================
        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            if (typeof code === 'object') { language = code.lang; code = code.text; }
            if (language === 'mermaid') return `<pre class="mermaid">${escapeHtml(code)}</pre>`;
            if (language === 'plantuml') {
                const encoded = btoa(unescape(encodeURIComponent(code)));
                return `<div class="plantuml-diagram" data-plantuml-source="${encoded}"><pre><code>${escapeHtml(code)}</code></pre></div>`;
            }
            return `<pre><code class="${language ? 'language-' + language : ''}">${escapeHtml(code)}</code></pre>`;
        };
        renderer.heading = function(text, level) {
            if (typeof text === 'object') { level = text.depth; text = text.text; }
            const id = text.toLowerCase().replace(/[^\w]+/g, '-');
            return `<h${level} id="${id}">${text}</h${level}>`;
        };
        marked.setOptions({ renderer, gfm: true, breaks: false });

        function isDarkMode() {
            return document.documentElement.getAttribute('data-theme') === 'dark' ||
                (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }

        mermaid.initialize({ startOnLoad: false, theme: isDarkMode() ? 'dark' : 'default', securityLevel: 'loose', flowchart: { useMaxWidth: true }, sequence: { useMaxWidth: true } });

        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('arckit-theme', next);
            mermaid.initialize({ startOnLoad: false, theme: next === 'dark' ? 'dark' : 'default', securityLevel: 'loose', flowchart: { useMaxWidth: true }, sequence: { useMaxWidth: true } });
        }

        // ============================================
        // Search
        // ============================================
        function buildSearchIndex() {
            allDocuments = [];
            sdgData.forEach(({ sdg, manifest }) => {
                const sdgLabel = `SDG ${sdg.num}: ${sdg.name}`;
                if (manifest.global) {
                    manifest.global.forEach(doc => {
                        allDocuments.push({ ...doc, sdgId: sdg.id, sdgLabel, searchText: `${doc.title} ${doc.category || ''} global ${sdgLabel}`.toLowerCase() });
                    });
                }
                if (manifest.projects) {
                    manifest.projects.forEach(project => {
                        const pName = project.name || project.id;
                        const addDocs = (docs, cat) => {
                            if (!docs) return;
                            docs.forEach(doc => {
                                allDocuments.push({ ...doc, sdgId: sdg.id, sdgLabel, project: pName, category: cat || doc.category, searchText: `${doc.title} ${cat || doc.category || ''} ${pName} ${sdgLabel}`.toLowerCase() });
                            });
                        };
                        addDocs(project.documents);
                        addDocs(project.diagrams, 'Diagrams');
                        addDocs(project.decisions, 'Decisions');
                        addDocs(project.wardleyMaps, 'Wardley Maps');
                        addDocs(project.dataContracts, 'Data Contracts');
                        addDocs(project.research, 'Research');
                        addDocs(project.reviews, 'Reviews');
                        addDocs(project.vendorProfiles, 'Vendor Profiles');
                        addDocs(project.techNotes, 'Tech Notes');
                        if (project.vendors) project.vendors.forEach(v => { if (v.documents) v.documents.forEach(doc => { allDocuments.push({ ...doc, sdgId: sdg.id, sdgLabel, project: pName, vendor: v.name, searchText: `${doc.title} ${v.name} vendor ${pName} ${sdgLabel}`.toLowerCase() }); }); });
                    });
                }
            });

            // Add guides
            if (guidesManifest) {
                if (guidesManifest.guides) guidesManifest.guides.forEach(doc => {
                    allDocuments.push({ ...doc, sdgId: guidesManifest._sdgId, searchText: `${doc.title} ${doc.category || ''} guide`.toLowerCase() });
                });
                if (guidesManifest.roleGuides) guidesManifest.roleGuides.forEach(doc => {
                    allDocuments.push({ ...doc, sdgId: guidesManifest._sdgId, searchText: `${doc.title} ${doc.family || ''} role ddat`.toLowerCase() });
                });
            }
        }

        function searchDocuments(query) {
            if (!query || query.length < 2) return [];
            const terms = query.toLowerCase().split(/\s+/);
            return allDocuments.filter(doc => terms.every(term => doc.searchText.includes(term))).slice(0, 15);
        }

        function setupSearch() {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            const doSearch = debounce(() => {
                const query = input.value.trim();
                const matches = searchDocuments(query);
                if (matches.length === 0) { results.classList.remove('visible'); return; }
                results.innerHTML = matches.map(doc => `
                    <div class="app-search-result" data-sdg="${doc.sdgId}" data-path="${doc.path}">
                        <div class="app-search-result-title">${doc.title}</div>
                        <div class="app-search-result-path">${doc.sdgLabel ? doc.sdgLabel + ' / ' : ''}${doc.project ? doc.project + ' / ' : ''}${doc.category || 'Document'}</div>
                    </div>
                `).join('');
                results.classList.add('visible');
                results.querySelectorAll('.app-search-result').forEach(el => {
                    el.addEventListener('click', () => {
                        const sdgId = el.dataset.sdg;
                        const path = el.dataset.path;
                        window.location.hash = `${sdgId}/${path}`;
                        loadDocument(sdgId, path);
                        input.value = '';
                        results.classList.remove('visible');
                        closeMobileSidebar();
                    });
                });
            }, 150);
            input.addEventListener('input', doSearch);
            input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; results.classList.remove('visible'); input.blur(); } });
            document.addEventListener('click', (e) => { if (!e.target.closest('#search-container')) results.classList.remove('visible'); });
        }

        // ============================================
        // Dashboard
        // ============================================
        function computeGlobalMetrics() {
            let totalProjects = 0, totalDocs = 0, totalADRs = 0;
            const categoryCounts = {};
            const sdgMetrics = [];

            sdgData.forEach(({ sdg, manifest }) => {
                const realProjects = (manifest.projects || []).filter(p => /^\d{3}-/.test(p.id));
                let sdgDocs = 0, sdgADRs = 0;
                let sdgCoverage = 0;

                realProjects.forEach(project => {
                    const docs = project.documents || [];
                    const diagrams = project.diagrams || [];
                    const decisions = project.decisions || [];
                    const wardleyMaps = project.wardleyMaps || [];
                    const dataContracts = project.dataContracts || [];
                    const research = project.research || [];
                    const reviews = project.reviews || [];
                    const vendorProfiles = project.vendorProfiles || [];
                    const techNotes = project.techNotes || [];
                    const allDocs = [...docs, ...diagrams, ...decisions, ...wardleyMaps, ...dataContracts, ...research, ...reviews, ...vendorProfiles, ...techNotes];
                    if (project.vendors) project.vendors.forEach(v => { if (v.documents) allDocs.push(...v.documents); });

                    sdgDocs += allDocs.length;
                    sdgADRs += decisions.length;

                    allDocs.forEach(doc => {
                        const tc = extractTypeCode(doc.path || '');
                        const cat = tc ? (TYPE_CATEGORIES[tc] || 'Other') : 'Other';
                        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
                    });

                    const presentTypes = new Set();
                    allDocs.forEach(doc => { const tc = extractTypeCode(doc.path || ''); if (tc) presentTypes.add(tc); });
                    const corePresent = CORE_ARTIFACTS.filter(t => presentTypes.has(t)).length;
                    sdgCoverage += CORE_ARTIFACTS.length > 0 ? Math.round((corePresent / CORE_ARTIFACTS.length) * 100) : 0;
                });

                // Add global docs
                const globalDocs = manifest.global || [];
                sdgDocs += globalDocs.length;

                totalProjects += realProjects.length;
                totalDocs += sdgDocs;
                totalADRs += sdgADRs;

                sdgMetrics.push({
                    sdg,
                    projects: realProjects.length,
                    docs: sdgDocs,
                    adrs: sdgADRs,
                    avgCoverage: realProjects.length > 0 ? Math.round(sdgCoverage / realProjects.length) : 0
                });
            });

            const avgCoverage = sdgMetrics.length > 0
                ? Math.round(sdgMetrics.reduce((sum, s) => sum + s.avgCoverage, 0) / sdgMetrics.length)
                : 0;

            return { totalProjects, totalDocs, totalADRs, avgCoverage, categoryCounts, sdgMetrics };
        }

        function renderDonutChart(containerId, data) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const total = data.reduce((sum, d) => sum + d.value, 0);
            if (total === 0) { container.innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">No data</p>'; return; }

            const size = 140, radius = 56, holeRadius = 36, cx = size / 2, cy = size / 2;
            let currentAngle = -Math.PI / 2;
            let paths = '';
            data.filter(d => d.value > 0).forEach(d => {
                const sliceAngle = (d.value / total) * 2 * Math.PI;
                const endAngle = currentAngle + sliceAngle;
                const largeArc = sliceAngle > Math.PI ? 1 : 0;
                if (Math.abs(sliceAngle - 2 * Math.PI) < 0.001) {
                    paths += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${d.color}" stroke-width="${radius - holeRadius}"/>`;
                } else {
                    const x1 = cx + radius * Math.cos(currentAngle), y1 = cy + radius * Math.sin(currentAngle);
                    const x2 = cx + radius * Math.cos(endAngle), y2 = cy + radius * Math.sin(endAngle);
                    const ix1 = cx + holeRadius * Math.cos(endAngle), iy1 = cy + holeRadius * Math.sin(endAngle);
                    const ix2 = cx + holeRadius * Math.cos(currentAngle), iy2 = cy + holeRadius * Math.sin(currentAngle);
                    paths += `<path d="M${x1},${y1} A${radius},${radius} 0 ${largeArc} 1 ${x2},${y2} L${ix1},${iy1} A${holeRadius},${holeRadius} 0 ${largeArc} 0 ${ix2},${iy2} Z" fill="${d.color}"/>`;
                }

        // ============================================
        // Document Loading
        // ============================================
        function destroyPanZoomInstances() {
            activePanZoomInstances.forEach(i => { try { i.destroy(); } catch(e) {} });
            activePanZoomInstances = [];
        }

        async function loadDocument(sdgId, path) {
            const content = document.getElementById('content');
            const toc = document.getElementById('toc');
            destroyPanZoomInstances();
            toc.style.display = 'none';
            content.innerHTML = '<div class="app-loading"><div class="app-spinner"></div>Loading document...</div>';

            const cacheKey = `${sdgId}/${path}`;
            try {
                let markdown;
                if (documentCache.has(cacheKey)) {
                    markdown = documentCache.get(cacheKey);
                } else {
                    const response = await fetch(getRawUrl(sdgId, path));
                    if (!response.ok) throw new Error(response.status === 404 ? 'not_found' : `fetch_error_${response.status}`);
                    markdown = await response.text();
                    documentCache.set(cacheKey, markdown);
                }

                let title = extractTitle(path);
                const h1Match = markdown.match(/^#\s+(.+)$/m);
                if (h1Match) { title = h1Match[1]; markdown = markdown.replace(/^#\s+.+$/m, '').trimStart(); }

                const sdgInfo = SDGS.find(s => s.id === sdgId);
                const sdgLabel = sdgInfo ? `SDG ${sdgInfo.num}: ${sdgInfo.name}` : sdgId;
                const parts = path.split('/');
                const breadcrumb = `<a href="#dashboard" class="app-dashboard-link">Dashboard</a> / <a href="#sdg-${sdgId}" class="app-dashboard-link">${sdgLabel}</a> / ${parts.slice(0, -1).join(' / ')}`;

                const html = marked.parse(markdown);
                content.innerHTML = `
                    <div class="app-doc-header">
                        <div class="app-doc-breadcrumb">${breadcrumb}</div>
                        <h1 class="app-doc-title">${title}</h1>
                    </div>
                    <div class="app-markdown">${html}</div>
                `;

                // Rewrite relative .md links
                const docDir = path.substring(0, path.lastIndexOf('/') + 1);
                content.querySelectorAll('.app-markdown a[href]').forEach(a => {
                    const href = a.getAttribute('href');
                    if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:')) return;
                    if (!href.endsWith('.md') && !href.includes('.md#')) return;
                    const pathParts = (docDir + href.split('#')[0]).split('/');
                    const resolved = [];
                    pathParts.forEach(p => { if (p === '..') resolved.pop(); else if (p && p !== '.') resolved.push(p); });
                    const fragment = href.includes('#') ? '#' + href.split('#').slice(1).join('#') : '';
                    const resolvedPath = resolved.join('/') + fragment;
                    a.href = '#' + sdgId + '/' + resolvedPath;
                    a.addEventListener('click', function(e) { e.preventDefault(); window.location.hash = sdgId + '/' + resolvedPath; loadDocument(sdgId, resolved.join('/')); });
                });

                buildTableOfContents(content.querySelector('.app-markdown'));
                try { await mermaid.run({ querySelector: '.mermaid' }); } catch (e) { console.warn('Mermaid error:', e); }
                renderPlantUMLDiagrams();
                initDiagramPanZoom();

                const plantumlImages = document.querySelectorAll('.plantuml-diagram img');
                if (plantumlImages.length) {
                    Promise.all(Array.from(plantumlImages).map(img => img.complete ? Promise.resolve() : new Promise(resolve => { img.addEventListener('load', resolve, { once: true }); img.addEventListener('error', resolve, { once: true }); }))).then(() => initPlantUMLPanZoom());
                }

                document.getElementById('main-content').scrollTo(0, 0);
            } catch (error) {
                const header = document.createElement('div'); header.className = 'app-doc-header';
                const bc = document.createElement('div'); bc.className = 'app-doc-breadcrumb'; bc.textContent = `${sdgId} / ${path.split('/').slice(0, -1).join(' / ')}`;
                const t = document.createElement('h1'); t.className = 'app-doc-title'; t.textContent = extractTitle(path);
                header.appendChild(bc); header.appendChild(t);
                const notice = document.createElement('div');
                notice.style.cssText = 'background:var(--background-light);border-left:4px solid var(--primary-color);padding:1.25rem;margin:1.5rem 0;';
                const h = document.createElement('p'); h.style.cssText = 'margin:0 0 0.75rem 0;font-weight:700;'; h.textContent = 'Document not found';
                const d = document.createElement('p'); d.style.cssText = 'margin:0;color:var(--text-muted);';
                d.appendChild(document.createTextNode('The file '));
                const code = document.createElement('code'); code.textContent = `${sdgId}/${path}`;
                d.appendChild(code);
                d.appendChild(document.createTextNode(' could not be loaded.'));
                notice.appendChild(h); notice.appendChild(d);
                content.replaceChildren(header, notice);
            }
        }

        // ============================================
        // Table of Contents
        // ============================================
        function buildTableOfContents(container) {
            const toc = document.getElementById('toc');
            const tocList = document.getElementById('toc-list');
            const headings = container.querySelectorAll('h2, h3');
            if (headings.length < 2) { toc.style.display = 'none'; return; }
            toc.style.display = '';
            tocList.innerHTML = '';
            headings.forEach(heading => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${heading.id}`;
                a.textContent = heading.textContent;
                if (heading.tagName === 'H3') a.classList.add('toc-h3');
                a.addEventListener('click', (e) => { e.preventDefault(); heading.scrollIntoView({ behavior: 'smooth' }); });
                li.appendChild(a);
                tocList.appendChild(li);
            });
            if (currentTocObserver) currentTocObserver.disconnect();
            currentTocObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) { tocList.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${entry.target.id}`)); } });
            }, { rootMargin: '-20% 0px -70% 0px' });
            headings.forEach(heading => currentTocObserver.observe(heading));
        }

        // ============================================
        // Diagram Rendering (PlantUML + Pan/Zoom)
        // ============================================
        function renderPlantUMLDiagrams() {
            document.querySelectorAll('.app-markdown .plantuml-diagram').forEach(diagram => {
                if (diagram.querySelector('img')) return;
                const encoded = diagram.dataset.plantumlSource;
                if (!encoded) return;
                const rawSource = decodeURIComponent(escape(atob(encoded)));
                const url = plantumlGetUrl(rawSource, 'svg');
                const img = document.createElement('img'); img.src = url; img.alt = 'PlantUML Diagram'; img.loading = 'lazy';
                img.onerror = function() { while (diagram.firstChild) diagram.removeChild(diagram.firstChild); const p = document.createElement('p'); p.textContent = 'PlantUML rendering failed.'; diagram.appendChild(p); };
                while (diagram.firstChild) diagram.removeChild(diagram.firstChild);
                diagram.appendChild(img);
            });
        }

        function initPlantUMLPanZoom() {
            if (typeof svgPanZoom === 'undefined') return;
            document.querySelectorAll('.app-markdown .plantuml-diagram').forEach(diagram => {
                const img = diagram.querySelector('img');
                if (!img || (diagram.parentElement && diagram.parentElement.classList.contains('plantuml-viewport'))) return;
                const container = document.createElement('div'); container.className = 'plantuml-container';
                const viewport = document.createElement('div'); viewport.className = 'plantuml-viewport';
                const controls = document.createElement('div'); controls.className = 'plantuml-controls';
                let currentScale = 1;
                [{ a: 'zoom-in', t: '+' }, { a: 'zoom-out', t: '\u2212' }, { a: 'reset', t: '\u21ba' }, { a: 'fullscreen', t: '\u26f6' }].forEach(def => {
                    const b = document.createElement('button'); b.className = 'mermaid-ctrl-btn'; b.dataset.action = def.a; b.textContent = def.t; controls.appendChild(b);
                });
                diagram.parentNode.insertBefore(container, diagram); viewport.appendChild(diagram); container.appendChild(viewport); container.appendChild(controls);
                function applyScale(s) { currentScale = Math.max(0.25, Math.min(10, s)); img.style.transform = 'scale(' + currentScale + ')'; img.style.transformOrigin = 'center center'; }
                controls.addEventListener('click', (e) => { const btn = e.target.closest('.mermaid-ctrl-btn'); if (!btn) return; const a = btn.dataset.action; if (a === 'zoom-in') applyScale(currentScale * 1.3); else if (a === 'zoom-out') applyScale(currentScale / 1.3); else if (a === 'reset') applyScale(1); else if (a === 'fullscreen') { container.classList.toggle('fullscreen'); setTimeout(() => applyScale(1), 50); } });
                viewport.addEventListener('wheel', (e) => { e.preventDefault(); applyScale(currentScale * (e.deltaY < 0 ? 1.1 : 0.9)); }, { passive: false });
            });
        }

        function initDiagramPanZoom() {
            destroyPanZoomInstances();
            if (typeof svgPanZoom === 'undefined') return;
            document.querySelectorAll('.app-markdown .mermaid').forEach(diagram => {
                const svg = diagram.querySelector('svg');
                if (!svg || (diagram.parentElement && diagram.parentElement.classList.contains('mermaid-viewport'))) return;
                if (!svg.getAttribute('width') || !svg.getAttribute('height')) { const bbox = svg.getBBox(); if (bbox.width && bbox.height) { svg.setAttribute('width', bbox.width); svg.setAttribute('height', bbox.height); } }
                const container = document.createElement('div'); container.className = 'mermaid-container';
                const viewport = document.createElement('div'); viewport.className = 'mermaid-viewport'; viewport.tabIndex = 0;
                const controls = document.createElement('div'); controls.className = 'mermaid-controls';
                [{ action: 'zoom-in', icon: 'line:12,5,12,19|line:5,12,19,12' }, { action: 'zoom-out', icon: 'line:5,12,19,12' }, { action: 'reset', icon: 'path:M3 12a9 9 0 1 0 9-9 4.5 4.5 0 0 0-4.5 4.5|path:M3 3v4.5h4.5' }, { action: 'fullscreen', icon: 'polyline:15 3 21 3 21 9|polyline:9 21 3 21 3 15|line:21,3,14,10|line:3,21,10,14' }].forEach(def => {
                    const button = document.createElement('button'); button.className = 'mermaid-ctrl-btn'; button.dataset.action = def.action;
                    const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svgEl.setAttribute('viewBox', '0 0 24 24');
                    def.icon.split('|').forEach(part => { const [type, data] = part.split(':'); if (type === 'line') { const [x1,y1,x2,y2] = data.split(','); const l = document.createElementNS('http://www.w3.org/2000/svg','line'); l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2); svgEl.appendChild(l); } else if (type === 'path') { const p = document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',data); svgEl.appendChild(p); } else if (type === 'polyline') { const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline'); pl.setAttribute('points',data); svgEl.appendChild(pl); } });
                    button.appendChild(svgEl); controls.appendChild(button);
                });
                diagram.parentNode.insertBefore(container, diagram); viewport.appendChild(diagram); container.appendChild(viewport); container.appendChild(controls);
                try {
                    const pz = svgPanZoom(svg, { fit: true, center: true, minZoom: 0.25, maxZoom: 10, zoomScaleSensitivity: 0.3, controlIconsEnabled: false, mouseWheelZoomEnabled: true, preventMouseEventsDefault: true });
                    activePanZoomInstances.push(pz);
                    controls.addEventListener('click', (e) => { const btn = e.target.closest('.mermaid-ctrl-btn'); if (!btn) return; const a = btn.dataset.action; if (a === 'zoom-in') pz.zoomIn(); else if (a === 'zoom-out') pz.zoomOut(); else if (a === 'reset') { pz.resetZoom(); pz.resetPan(); pz.fit(); pz.center(); } else if (a === 'fullscreen') { container.classList.toggle('fullscreen'); setTimeout(() => pz.resize(), 50); setTimeout(() => { pz.fit(); pz.center(); }, 100); } });
                    viewport.addEventListener('keydown', (e) => { if (e.key === '+' || e.key === '=') { e.preventDefault(); pz.zoomIn(); } else if (e.key === '-') { e.preventDefault(); pz.zoomOut(); } else if (e.key === '0') { e.preventDefault(); pz.resetZoom(); pz.resetPan(); pz.fit(); pz.center(); } else if (e.key === 'f') { e.preventDefault(); container.classList.toggle('fullscreen'); setTimeout(() => pz.resize(), 50); setTimeout(() => { pz.fit(); pz.center(); }, 100); } else if (e.key === 'Escape' && container.classList.contains('fullscreen')) { e.preventDefault(); container.classList.remove('fullscreen'); setTimeout(() => pz.resize(), 50); setTimeout(() => { pz.fit(); pz.center(); }, 100); } });
                } catch (err) { console.warn('svg-pan-zoom init failed:', err); }
            });
        }

        // Global Escape for fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const fs = document.querySelector('.mermaid-container.fullscreen');
                if (fs) { fs.classList.remove('fullscreen'); }
                const pfs = document.querySelector('.plantuml-container.fullscreen');
                if (pfs) { pfs.classList.remove('fullscreen'); }
            }
        });

        // ============================================
        // Sidebar / Mobile / Keyboard
        // ============================================
        function setupSidebarToggle() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const expandBtn = document.getElementById('sidebar-expand');
            function toggle() { sidebar.classList.toggle('collapsed'); const c = sidebar.classList.contains('collapsed'); toggleBtn.innerHTML = c ? '&#9654;' : '&#9664;'; }
            toggleBtn.addEventListener('click', toggle);
            expandBtn.addEventListener('click', toggle);
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); document.getElementById('sidebar-toggle').click(); }
                if (e.key === 'Escape') { const si = document.getElementById('search-input'); if (document.activeElement === si) { si.blur(); document.getElementById('search-results').classList.remove('visible'); } }
            });
        }

        function openMobileSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-backdrop').classList.add('visible'); }
        function closeMobileSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-backdrop').classList.remove('visible'); }

        document.getElementById('mobile-menu').addEventListener('click', () => {
            const s = document.getElementById('sidebar');
            if (s.classList.contains('open')) closeMobileSidebar(); else openMobileSidebar();
        });
        document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileSidebar);

        // ============================================
        // Hash Routing
        // ============================================
        function handleHash() {
            const hash = window.location.hash.slice(1);
            if (!hash || hash === 'dashboard') { showDashboard(); return; }
            if (hash === 'guides') { showGuidesIndex(); return; }
            if (hash === 'roles') { showRolesIndex(); return; }

            // SDG detail: #sdg-sdg-01-no-poverty
            if (hash.startsWith('sdg-sdg-')) {
                const sdgId = hash.slice(4); // remove 'sdg-'
                showSdgDetail(sdgId);
                return;
            }

            // Document: #sdg-01-no-poverty/projects/001-.../ARC-001-REQ-v1.0.md
            const slashIdx = hash.indexOf('/');
            if (slashIdx > 0) {
                const sdgId = hash.substring(0, slashIdx);
                const path = hash.substring(slashIdx + 1);
                loadDocument(sdgId, path);
                // Update active state
                const link = document.querySelector(`a[data-sdg="${sdgId}"][data-path="${path}"]`);
                if (link) {
                    document.querySelectorAll('#nav-container a').forEach(a => a.classList.remove('active'));
                    link.classList.add('active');
                    // Expand parent SDG section
                    const section = link.closest('.app-nav-section');
                    if (section) {
                        const header = section.querySelector('.app-nav-section-header');
                        if (header && header.classList.contains('collapsed')) {
                            header.classList.remove('collapsed');
                            header.nextElementSibling.style.display = 'block';
                        }
                    }
                }
                return;
            }

            showDashboard();
        }

        window.addEventListener('hashchange', handleHash);

        // ============================================
        // Initialization
        // ============================================
        async function init() {
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('arckit-theme')) {
                    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                    mermaid.initialize({ startOnLoad: false, theme: e.matches ? 'dark' : 'default', securityLevel: 'loose' });
                }
            });

            // Load all manifests in parallel
            const results = await Promise.allSettled(
                SDGS.map(async (sdg) => {
                    const response = await fetch(`../${sdg.id}/docs/manifest.json`);
                    if (!response.ok) throw new Error(`Failed: ${sdg.id}`);
                    const manifest = await response.json();
                    manifest._sdgId = sdg.id;
                    return { sdg, manifest };
                })
            );

            sdgData = results.filter(r => r.status === 'fulfilled').map(r => r.value);

            if (sdgData.length === 0) {
                document.getElementById('content').innerHTML = '<div class="app-error">No SDG workspace manifests found. Ensure each sdg-*/docs/manifest.json exists.</div>';
                document.getElementById('nav-container').innerHTML = '<div class="app-error">No workspaces loaded</div>';
                return;
            }

            // Use first loaded SDG for guides (all identical)
            guidesManifest = sdgData[0].manifest;

            // Populate TYPE_CATEGORIES from first manifest
            if (guidesManifest.typeCategories) TYPE_CATEGORIES = guidesManifest.typeCategories;

            // Footer
            document.getElementById('footer-generated').textContent = `${sdgData.length} SDG workspaces loaded`;

            buildSearchIndex();
            buildNavigation();
            setupSearch();
            setupSidebarToggle();
            setupKeyboardShortcuts();

            // Setup nav links
            document.getElementById('dashboard-link').addEventListener('click', (e) => { e.preventDefault(); window.location.hash = 'dashboard'; closeMobileSidebar(); });
            document.getElementById('header-title').addEventListener('click', (e) => { e.preventDefault(); window.location.hash = 'dashboard'; closeMobileSidebar(); });
            document.getElementById('guides-link').addEventListener('click', (e) => { e.preventDefault(); window.location.hash = 'guides'; closeMobileSidebar(); });
            document.getElementById('roles-link').addEventListener('click', (e) => { e.preventDefault(); window.location.hash = 'roles'; closeMobileSidebar(); });

            handleHash();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
